[package]
name = "homebase"
version = "0.0.0"
description = "HomeBase – personal household management"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
# rlib only: staticlib/cdylib are for mobile targets and tripled the lib build + link time (dev rebuild 90s -> 45s).
name = "homebase_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Native save/open dialogs for backup, restore, export and import.
tauri-plugin-dialog = "2"
# Already built as part of tauri-plugin-sql (same version and features, so no extra
# compile time). Used directly for VACUUM INTO, backup validation and JSON import.
sqlx = { version = "0.8", features = ["sqlite"] }
# Required by `tauri::generate_context!()` to embed plugin configuration.
serde_json = "1"
# Log file in the platform's log folder (Rust `log` macros + frontend via @tauri-apps/plugin-log).
tauri-plugin-log = "2"
log = "0.4"
# Native message box for fatal startup errors (e.g. a failed migration), when no
# AppHandle exists for the dialog plugin. Same version and features the dialog
# plugin already builds, so no extra compile time.
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
