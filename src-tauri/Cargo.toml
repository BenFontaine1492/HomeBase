[package]
name = "homebase"
version = "0.1.0"
description = "HomeBase – personal household management"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "homebase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Required by `tauri::generate_context!()` to embed plugin configuration.
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
