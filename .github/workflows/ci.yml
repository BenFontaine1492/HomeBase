# CI: checks every pull request (and every push to main) automatically.
# Built up step by step; see PlannedFeatures.md item 1, step 3.
#
# Two jobs that run in parallel, each on its own fresh runner:
#   typescript: type check, TS unit tests (100% coverage), frontend build
#   rust:       Rust unit tests (100% line coverage)
# The installers are built by a separate release workflow (step 5), not here.
name: CI

# Trigger: when this workflow runs.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    # Runner: a fresh Windows machine from GitHub, deleted after the run.
    runs-on: windows-latest
    steps:
      # Download the repository's code onto the runner.
      - uses: actions/checkout@v7

      # Install the Node.js version from .node-version, and cache npm downloads between runs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # Install exactly the packages listed in package-lock.json.
      - run: npm ci

      - run: npm run typecheck

      # Unit tests + coverage. Fails (exit code not 0) if a test fails or coverage drops
      # below the 100% thresholds in vitest.config.ts, which turns the whole job red.
      - run: npm run test:coverage

      # Does the frontend still build? (type check + vite build into dist/)
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The Rust code embeds dist/ at compile time (tauri::generate_context!), so the
      # tests can't compile without it. vite build only (~20 s): the typescript job
      # already does the type check, and waiting for that job would end the parallelism.
      - run: npx vite build

      # Rust compiler + llvm-tools (needed for the coverage measurement).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # Cache: keeps compiled Rust libraries between runs (first run ~10-15 min, later much faster).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Downloads the prebuilt cargo-llvm-cov (no compiling).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Rust tests + coverage. Fails below 100% lines (see the coverage:rust script).
      - run: npm run coverage:rust
