# CI: checks every pull request (and every push to main) automatically.
#
# Four jobs, all in parallel, each on its own fresh runner:
#   lint:                 format check (Oxfmt) + lint (Oxlint), Linux only
#   audit:                npm audit via scripts/audit.mjs (fails on high/critical advisories not in
#                         audit-allowlist.json, or allowlisted past their expiry date), Linux only
#   typescript unit-test: type check, TS unit tests (100% coverage), frontend build (Windows + Linux)
#   rust unit-test:       Rust unit tests (100% line coverage) (Windows + Linux)
# The installers are built by a separate release workflow (step 5), not here.
name: CI

# Trigger: when this workflow runs.
on:
  pull_request:
  push:
    branches: [main]
  # Reusable: release.yml calls this workflow to test the merged commit before building.
  workflow_call:
    inputs:
      ref:
        description: Commit to test (empty = the commit that triggered the run)
        type: string
        default: ''

jobs:
  # Check only, never --fix: run `make linting` locally to fix. Lint results don't depend on the OS.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

  # Security advisories for the packages in package-lock.json (no install needed). High and
  # critical fail the job; moderate and low are listed in the log without blocking.
  # Fix locally with `make audit-fix`.
  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # npm audit + audit-allowlist.json (accepted advisories without a fix, each with an expiry date).
      - run: node scripts/audit.mjs --audit-level=high

  typescript-unit-test:
    name: typescript unit-test (${{ matrix.os }})
    strategy:
      # Let the other operating system finish even if one fails.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    # Runner: a fresh machine from GitHub, deleted after the run.
    runs-on: ${{ matrix.os }}
    steps:
      # Download the repository's code onto the runner.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Install the Node.js version from .node-version, and cache npm downloads between runs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # Install exactly the packages listed in package-lock.json.
      - run: npm ci

      - run: npm run typecheck

      # Unit tests + coverage. Fails (exit code not 0) if a test fails or coverage drops
      # below the 100% thresholds in vitest.config.ts, which turns the whole job red.
      - run: npm run test:coverage

      # Does the frontend still build? (type check + vite build into dist/)
      - run: npm run build

  rust-unit-test:
    name: rust unit-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Linux only: system libraries Tauri needs to compile (WebKitGTK for the window,
      # GTK for dialogs, ...). Windows ships the equivalents (WebView2) already.
      # Only what compiling + testing needs (from https://v2.tauri.app/start/prerequisites/#linux):
      # build-essential/curl/wget/file are preinstalled on the runner, and appindicator/librsvg
      # are only for tray icons (the app has none; the release build still installs them).
      # Speed-ups: no man-db index rebuild after an install (took minutes for webkit's
      # hundreds of packages), and the installed files are cached between runs.
      - name: Skip man-db index rebuild
        if: runner.os == 'Linux'
        run: |
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update

      # Cache miss: apt install + save the files. Cache hit: unpacks them (~30 s, no apt).
      # Change `version` to force a fresh install (e.g. after changing the package list).
      - name: Install Linux system libraries (cached)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          version: 1

      # A cache hit only unpacks files and skips the packages' install scripts, so refresh the
      # shared library cache, or the test binaries may not find libwebkit2gtk at runtime.
      - name: Refresh shared library cache
        if: runner.os == 'Linux'
        run: sudo ldconfig

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The Rust code embeds dist/ at compile time (tauri::generate_context!), so the
      # tests can't compile without it. vite build only (~20 s): the typescript job
      # already does the type check, and waiting for that job would end the parallelism.
      - run: npx vite build

      # Rust compiler + llvm-tools (needed for the coverage measurement).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # Cache: keeps compiled Rust libraries between runs (first run ~10-15 min, later much faster).
      # Each operating system gets its own cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Downloads the prebuilt cargo-llvm-cov (no compiling).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Rust tests + coverage. Fails below 100% lines (see the coverage:rust script).
      - run: npm run coverage:rust
